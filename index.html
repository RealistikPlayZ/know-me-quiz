<!Doctype HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Well Do You Know Me?</title>
  <link rel="stylesheet" href="quizstyle.css">
</head>
<body>

  <div class="quiz-container">
    <div id="start-screen" class="screen">
      <h1>How Well Do You Know Me?</h1>
      <p>Test your knowledge and see how high you can score!</p>
      
      <div class="input-group">
        <label for="username">Enter your name:</label>
        <input type="text" id="username" placeholder="Your name..." required>
      </div>
      
      <button id="start-btn" class="btn">Start Quiz</button>
    </div>

    <div id="quiz-screen" class="screen hide">
      <div class="quiz-header">
        <span id="progress-text">Question 1 of 10</span>
        <div class="progress-bar-container">
          <div id="progress-bar"></div>
        </div>
      </div>

      <h2 id="question-text">Question goes here...</h2>

      <div id="options-container" class="options-grid">
        <!-- Option buttons will be dynamically generated by JavaScript -->
      </div>

      <button id="next-btn" class="btn hide">Next Question</button>
    </div>

    <div id="result-screen" class="screen hide">
      <h2>Quiz Completed!</h2>
      <p id="final-message">Great job!</p>
      <div class="score-display">
        <span id="final-score">0</span> / <span id="total-questions">0</span>
      </div>
      <button id="restart-btn" class="btn">Play Again</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
